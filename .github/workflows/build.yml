name: Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to rebuild and publish (leave blank for build only)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Build release executable
        run: cargo build --release --locked

      - name: Prepare executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target\release\oneshot-ocr.exe dist\OneShot-OCR-Windows-x64.exe

      - name: Upload unsigned executable for signing
        id: upload-unsigned
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: OneShot-OCR-Windows-x64-unsigned
          path: dist/OneShot-OCR-Windows-x64.exe
          if-no-files-found: error

      - name: Submit signing request
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd
        with:
          api-token: ${{ secrets.SIGNPATH_APITOKEN }}
          organization-id: c677c167-9f3e-4577-b967-5d7730bf742d
          project-slug: GameSentenceMiner
          artifact-configuration-slug: OneShot_OCR
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed_output

      - name: Use signed executable when available
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path signed_output -Recurse -File -Filter OneShot-OCR-Windows-x64.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($signed) {
            Copy-Item $signed.FullName dist\OneShot-OCR-Windows-x64.exe -Force
          } else {
            Write-Warning "Signed executable not available; using unsigned executable."
          }

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: OneShot-OCR-Windows-x64
          path: dist/OneShot-OCR-Windows-x64.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download executable
        uses: actions/download-artifact@v5
        with:
          name: OneShot-OCR-Windows-x64
          path: release

      - name: Create or update GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/OneShot-OCR-Windows-x64.exe --clobber
          else
            gh release create "$RELEASE_TAG" release/OneShot-OCR-Windows-x64.exe --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
