name: Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Build release executable
        run: cargo build --release --locked

      - name: Prepare executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target\release\oneshot-ocr.exe dist\OneShot-OCR-Windows-x64.exe

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: OneShot-OCR-Windows-x64
          path: dist/OneShot-OCR-Windows-x64.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download executable
        uses: actions/download-artifact@v5
        with:
          name: OneShot-OCR-Windows-x64
          path: release

      - name: Create or update GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/OneShot-OCR-Windows-x64.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/OneShot-OCR-Windows-x64.exe --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
