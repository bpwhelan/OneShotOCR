[package]
name = "oneshot-ocr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
global-hotkey = "0.8.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
libloading = "0.8"
prost = "0.14.4"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "http2", "charset", "native-tls", "gzip", "brotli", "deflate", "zstd"] }
softbuffer = "0.4.8"
tray-icon = "0.24.2"
winit = "0.30.13"
xcap = "0.9.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_System_LibraryLoader"] }

[profile.release]
opt-level = 3
